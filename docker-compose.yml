# Local demonstration environment: PostgreSQL plus two middleware instances.
#
# The two instances are configured to post their language-model callbacks to *each other* rather
# than to themselves. That is deliberate (R-011): it guarantees the cross-instance callback path
# is exercised on every single message, instead of leaving it to a load balancer's chance
# distribution. A real deployment would put a load balancer here and let it distribute callbacks;
# peer-pointing is a substitute that makes the case certain rather than likely.

services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: llmapi
      POSTGRES_USER: postgres
      # Demonstration-only credential for a database published on localhost. There is no
      # authentication anywhere in this system by specification (FR-020), so this is not
      # protecting anything that is otherwise protected.
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d llmapi"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  middleware-1:
    build:
      context: .
      dockerfile: src/Middleware/Dockerfile
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=llmapi;Username=postgres;Password=postgres"
      Processing__InstanceId: middleware-1
      Processing__ClaimTimeout: "00:00:30"
      Processing__SweepInterval: "00:00:00.250"
      FakeProvider__Mode: Respond
      FakeProvider__Delay: "00:00:02"
      # Points at its peer, so every callback crosses a process boundary.
      FakeProvider__CallbackBaseUri: http://middleware-2:8080
    depends_on:
      postgres:
        condition: service_healthy

  middleware-2:
    build:
      context: .
      dockerfile: src/Middleware/Dockerfile
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=llmapi;Username=postgres;Password=postgres"
      Processing__InstanceId: middleware-2
      Processing__ClaimTimeout: "00:00:30"
      Processing__SweepInterval: "00:00:00.250"
      FakeProvider__Mode: Respond
      FakeProvider__Delay: "00:00:02"
      FakeProvider__CallbackBaseUri: http://middleware-1:8080
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
